[workspace]
resolver = "2"
members = [
    "crates/*",
    "sketches/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/stmh/plotta-studio"

[workspace.dependencies]
drawing-core = { path = "crates/drawing-core" }
drawing-text = { path = "crates/drawing-text" }
drawing-utils = { path = "crates/drawing-utils" }
sketch-runner = { path = "crates/sketch-runner" }
drawing-svg = { path = "crates/drawing-svg" }
drawing-plotter = { path = "crates/drawing-plotter", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Rendering
vello = "0.4"
winit = "0.30"
pollster = "0.4"
wgpu = "24"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "2.0"
anyhow = "1.0"
