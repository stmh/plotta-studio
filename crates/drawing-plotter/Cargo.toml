[package]
name = "drawing-plotter"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["hardware"]
# Enable hardware serial communication (requires libudev on Linux)
hardware = ["serialport"]

[dependencies]
drawing-core = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
rstar = { workspace = true }

# Serial communication for AxiDraw (optional, requires system libraries)
serialport = { version = "4.3", optional = true }
